<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend</title>
    <script>
        const segment = location.pathname.split('/').filter(Boolean);
        const base = '/SmartSpend/';
        const route = segment.slice(1).join('/');
        const query = location.search;
        const hash = location.hash;

        sessionStorage.setItem(
            'smartspend-redirect',
            JSON.stringify({
                route: route,
                query: query,
                hash: hash
            })
        );

        location.replace(base);
    </script>
</head>
<body>
    <p>Redirecting to SmartSpend...</p>
</body>
</html>
