spring.application.name=SmartSpend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
# Generate a secure secret: openssl rand -base64 64
# Store in environment variable JWT_SECRET for production
app.jwt.secret=${JWT_SECRET:4G7K9N2Q5R8T1V4X7Y2A5B8C1E3F6H9J}
app.jwt.expiration=3600000