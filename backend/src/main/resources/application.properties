spring.application.name=SmartSpend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartspend?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
# Generate a secure secret: openssl rand -base64 64
# Store in environment variable JWT_SECRET for production
app.jwt.secret=${JWT_SECRET:4G7K9N2Q5R8T1V4X7Y2A5B8C1E3F6H9J}
app.jwt.expiration=3600000